<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Image Generator</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!--
      This webapp replicates the look of the official ChatGPT mobile interface
      shown in the provided screenshot. All dark elements now use a teal accent
      with a soft neon glow on buttons, borders and the prompt bar. The markup
      is intentionally minimal – most of the layout is controlled via CSS.
    -->
    <div class="mobile-frame">
      <!-- Top bar with app name and actions -->
      <div class="top-bar">
        <div class="top-left">
          <div class="hamburger" aria-label="Menu button">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <!-- Updated brand label -->
          <div class="app-label">Aiexor</div>
        </div>
      <div class="top-right">
          <!-- Sign-in button: repurpose the new chat button for Google sign-in -->
          <button id="sign-in-btn" class="icon-button" aria-label="Sign in">
            <!-- person icon for sign in -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="7" r="4" />
              <path d="M6 21v-2a4 4 0 014-4h4a4 4 0 014 4v2" />
            </svg>
          </button>
          <!-- Secondary top-right button: left untouched for now (can be used for settings or future features) -->
          <button class="icon-button" aria-label="Secondary action">
            <!-- ellipsis icon -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="1" />
              <circle cx="19" cy="12" r="1" />
              <circle cx="5" cy="12" r="1" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Main content area -->
      <main class="content">
        <!-- Empty state: centered call‑to‑action with preset prompts. This will be hidden
             once the user generates their first image. The presets provide
             inspiration and can be clicked to autofill the prompt and start
             generation. -->
        <div id="empty-state" class="empty-state">
          <h1 class="first-message">Generate Your First Image</h1>
          <div class="preset-prompts">
            <button type="button" class="preset-btn" data-prompt="Sunset over ocean">Sunset over ocean</button>
            <button type="button" class="preset-btn" data-prompt="Futuristic city skyline">Futuristic city skyline</button>
            <button type="button" class="preset-btn" data-prompt="Ancient temple in jungle">Ancient temple in jungle</button>
            <button type="button" class="preset-btn" data-prompt="Cyberpunk street at night">Cyberpunk street at night</button>
            <button type="button" class="preset-btn" data-prompt="Dragon flying over mountains">Dragon flying over mountains</button>
          </div>
        </div>
        <!-- Container for generated images and messages -->
        <div id="output" class="output"></div>
      </main>

      <!-- Sidebar for menu opened by hamburger icon -->
      <div id="sidebar" class="sidebar">
        <!-- Close button for the sidebar -->
        <button id="close-sidebar" class="close-sidebar-btn" aria-label="Close sidebar">&times;</button>
        <div class="sidebar-content">
          <h2>Menu</h2>
          <p>This is a placeholder sidebar. Add links or additional controls here.</p>
        </div>
      </div>

      <!-- Style menu for selecting art styles -->
      <div id="style-menu" class="style-menu"></div>

      <!-- Prompt bar at bottom -->
      <form class="prompt-bar" id="prompt-form" autocomplete="off">
        <!-- Style picker button: now a paint brush icon instead of a plus -->
        <button type="button" class="plus-btn" id="style-btn" aria-label="Choose style">
          <!-- paint brush icon (bootstrap brush) -->
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
            <path d="M15.825.12a.5.5 0 0 1 .132.584c-1.53 3.43-4.743 8.17-7.095 10.64a6.1 6.1 0 0 1-2.373 1.534c-.018.227-.06.538-.16.868-.201.659-.667 1.479-1.708 1.74a8.1 8.1 0 0 1-3.078.132 4 4 0 0 1-.562-.135 1.4 1.4 0 0 1-.466-.247.7.7 0 0 1-.204-.288.62.62 0 0 1 .004-.443c.095-.245.316-.38.461-.452.394-.197.625-.453.867-.826.095-.144.184-.297.287-.472l.117-.198c.151-.255.326-.54.546-.848.528-.739 1.201-.925 1.746-.896q.19.012.348.048c.062-.172.142-.38.238-.608.261-.619.658-1.419 1.187-2.069 2.176-2.67 6.18-6.206 9.117-8.104a.5.5 0 0 1 .596.04M4.705 11.912a1.2 1.2 0 0 0-.419-.1c-.246-.013-.573.05-.879.479-.197.275-.355.532-.5.777l-.105.177c-.106.181-.213.362-.32.528a3.4 3.4 0 0 1-.76.861c.69.112 1.736.111 2.657-.12.559-.139.843-.569.993-1.06a3 3 0 0 0 .126-.75zm1.44.026c.12-.04.277-.1.458-.183a5.1 5.1 0 0 0 1.535-1.1c1.9-1.996 4.412-5.57 6.052-8.631-2.59 1.927-5.566 4.66-7.302 6.792-.442.543-.795 1.243-1.042 1.826-.121.288-.214.54-.275.72v.001l.575.575zm-4.973 3.04.007-.005zm3.582-3.043.002.001h-.002z" />
          </svg>
        </button>
        <!-- Use a textarea for multi-line prompts so the bar expands for long input -->
        <textarea
          id="prompt-input"
          class="prompt-input"
          placeholder="Describe your image"
          required
        ></textarea>
        <!-- Generate button (repurposed mic button) -->
        <button type="button" class="icon-button generate-btn" id="generate-btn" aria-label="Generate image">
          <!-- image icon representing generation -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="14" rx="2" ry="2" />
            <circle cx="8.5" cy="8.5" r="1.5" />
            <polyline points="21 15 16 10 5 21" />
          </svg>
        </button>
        <!-- Removed the global download button. Individual images will now
             have their own download and remix controls. -->
      </form>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
